<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSI Hub</title>
<!--
Refactor summary:
- Consolidated duplicate CSS, moved inline styles into reusable classes, and organized styles as reset/base → layout → components → utilities.
- Replaced inline event handlers with delegated JavaScript events grouped inside a PsiHubApp class.
- Centralized state, constants, page templates, form behavior, popup/loading behavior, route handling, and file attachment handling.
- Preserved the existing UI/content while fixing intended conditional-form behavior: hidden outside-company fields are required only when visible.
- Approx. line count reduction: 844 → 761 lines, about 10% smaller.
-->
<style>
:root{
  --primary:#dc2626;--primary-dark:#b91c1c;--dark:#1f2937;--sidebar:#1e293b;
  --text:#374151;--muted:#6b7280;--border:#e5e7eb;--bg:#f3f4f6;--card:#fff;
  --info:#3b82f6;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-500:#64748b;
  --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-800:#1e40af;
  --amber-100:#fef3c7;--amber-700:#a16207;--amber-800:#92400e;
  --green-100:#d1fae5;--green-800:#065f46;--red-50:#fef2f2;--red-100:#fee2e2;--red-200:#fecaca;--red-800:#991b1b;--red-900:#7f1d1d;
  --r:12px;--r-sm:8px;--r-lg:16px;--shadow:0 4px 6px rgba(0,0,0,.05);--fast:.2s;
  --sidebar-w:260px;--workday-start:480;--workday-end:1060;
}
/* Reset / base */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--dark);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.7}
/* Layout */
.dashboard{display:none;min-height:100vh}
.sidebar{position:fixed;width:var(--sidebar-w);height:100vh;overflow-y:auto;background:var(--sidebar);color:#fff;padding:20px 0}
.sidebar-header{padding:0 20px 20px;border-bottom:1px solid #334155;margin-bottom:20px}
.sidebar-header h2{display:flex;align-items:center;gap:10px;font-size:20px}
.user-info{margin-top:5px;color:#94a3b8;font-size:13px}
.main-content{margin-left:var(--sidebar-w);padding:30px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.header h1{color:var(--dark);font-size:24px}
/* Login / loading */
.login-container,.loading-screen{align-items:center;justify-content:center;background:#0f172a}
.login-container{position:relative;display:flex;min-height:100vh;overflow:hidden;background:#0f172a}
.login-box{position:relative;z-index:2;width:100%;max-width:440px;padding:50px;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:rgba(255,255,255,.97);box-shadow:0 30px 100px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
.login-box h1{text-align:center;color:var(--primary);font-size:48px;font-weight:900;letter-spacing:3px}
.login-subtitle{text-align:center;color:var(--muted);font-size:18px;font-style:italic;font-weight:500;margin-bottom:8px}
.login-genba{text-align:center;color:var(--primary);font-size:28px;font-weight:700;letter-spacing:4px;margin-bottom:30px}
.flags-bar{position:absolute;bottom:30px;left:50%;z-index:3;display:flex;gap:20px;transform:translateX(-50%)}
.flags-bar img{width:60px;height:40px;object-fit:cover;border:2px solid rgba(255,255,255,.3);border-radius:6px;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.loading-screen{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;gap:20px}
.loading-screen.active{display:flex}
.toyota-loader{color:var(--primary);font-size:72px;font-weight:900;letter-spacing:8px;text-shadow:0 0 30px rgba(220,38,38,.5);animation:flipToyota .7s ease-in-out infinite}
.loader-sub{color:#94a3b8;font-size:14px;letter-spacing:3px}
.loader-sub2{color:#64748b;font-size:12px;letter-spacing:2px;margin-top:-10px}
@keyframes flipToyota{0%{transform:perspective(400px) rotateY(0);opacity:1}50%{transform:perspective(400px) rotateY(180deg);opacity:.7}100%{transform:perspective(400px) rotateY(360deg);opacity:1}}
/* Navigation */
.nav-section{margin-bottom:10px}
.nav-title{padding:10px 20px;color:#64748b;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-left:3px solid transparent;font-size:14px;cursor:pointer;transition:var(--fast)}
.nav-item:hover,.nav-item.active{background:#334155;border-left-color:var(--primary)}
.nav-item .arrow{margin-left:auto;font-size:11px;transition:transform var(--fast)}
.nav-item.open .arrow{transform:rotate(90deg)}
.badge-dev{margin-left:auto;padding:2px 8px;border-radius:10px;background:#475569;color:#94a3b8;font-size:10px}
.submenu{display:none;background:#0f172a}
.submenu.open{display:block}
.submenu .nav-item{padding-left:48px;font-size:13px}
.submenu .nav-item.active{background:#1e293b}
/* Forms / cards */
.content-card{max-width:900px;padding:35px;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow)}
.content-card h2{margin-bottom:8px;color:var(--text)}
.content-card>p{margin-bottom:25px;color:var(--muted);font-size:15px}
.home-hero{max-width:1180px;margin-bottom:24px;padding:34px;border-radius:24px;background:linear-gradient(135deg,#1e293b 0%,#334155 48%,#dc2626 100%);color:#fff;box-shadow:0 14px 34px rgba(15,23,42,.18)}
.home-hero h2{margin-bottom:8px;font-size:30px}.home-hero p{max-width:760px;color:#e2e8f0;font-size:15px}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:22px;max-width:1180px}.home-group-card{padding:24px;border:1px solid var(--border);border-radius:20px;background:#fff;box-shadow:var(--shadow)}.home-group-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px}.home-group-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:46px;height:46px;border-radius:15px;background:var(--red-50);font-size:24px}.home-group-title{margin-bottom:3px;color:var(--dark);font-size:18px;font-weight:900}.home-group-desc{color:var(--muted);font-size:13px}.home-btn-grid{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:12px}.home-module-btn{display:flex;align-items:center;gap:10px;min-height:54px;padding:13px 14px;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--text);font-size:13px;font-weight:800;text-align:left;transition:var(--fast)}.home-module-btn:hover{border-color:var(--primary);background:var(--red-50);color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 18px rgba(220,38,38,.10)}.home-module-btn .module-icon{font-size:20px}.home-module-btn.dev{border-style:dashed;background:#f8fafc;color:#64748b}.home-module-sub{display:block;margin-top:2px;color:#94a3b8;font-size:11px;font-weight:600}.home-module-text{line-height:1.15}.form-note{margin:12px 0 20px;padding:14px 16px;border-left:4px solid var(--warning);border-radius:0 10px 10px 0;background:var(--amber-100);color:var(--amber-800);font-size:13px;font-weight:600}.score-box{display:flex;align-items:center;justify-content:center;min-height:48px;border:2px solid var(--border);border-radius:var(--r);background:#f8fafc;color:var(--primary);font-size:22px;font-weight:900}.terms-box{padding:16px;border:2px solid var(--border);border-radius:var(--r);background:#f8fafc}.terms-box label{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:13px;font-weight:600;line-height:1.45}.terms-box input{width:18px;height:18px;flex-shrink:0;margin-top:2px;accent-color:var(--primary)}.participant-box{padding:14px;border:2px solid var(--border);border-radius:var(--r);background:#f8fafc;margin-bottom:12px}.participant-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--dark);font-weight:800}.participant-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}@media(max-width:980px){.home-grid{grid-template-columns:1fr}.participant-grid{grid-template-columns:1fr}}@media(max-width:560px){.home-hero{padding:24px}.home-hero h2{font-size:24px}.home-btn-grid{grid-template-columns:1fr}}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}
.form-grid.full{grid-template-columns:1fr}
.form-group{margin-bottom:22px}
.form-group label,.input-group label,.route-label{margin-bottom:6px;color:#4b5563;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.form-group label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;text-transform:none;letter-spacing:0}
.input-group{display:flex;flex-direction:column}
.form-group input,.input-group input,.input-group select,.input-group textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r);background:#fff;font-size:14px;transition:var(--fast)}
.form-group input{padding:14px 18px;font-size:15px}
.form-group input:focus,.input-group input:focus,.input-group select:focus,.input-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.form-group input:focus{box-shadow:0 0 0 4px rgba(220,38,38,.1)}
.input-group input:disabled,.input-group input[readonly]{background:#f8fafc;color:var(--dark);font-weight:600}
.input-group textarea{min-height:80px;resize:vertical}
/* Buttons */
.btn,.submit-btn,.popup-close{border-radius:var(--r);background:var(--primary);color:#fff;font-weight:700;transition:var(--fast)}
.btn{width:100%;padding:16px;font-size:17px;letter-spacing:1px}
.btn:hover{background:var(--primary-dark);box-shadow:0 8px 20px rgba(220,38,38,.3);transform:translateY(-2px)}
.submit-btn{margin-top:10px;padding:14px 36px;font-size:16px;letter-spacing:.5px}
.submit-btn:hover,.popup-close:hover{background:var(--primary-dark)}
.submit-btn:hover{transform:translateY(-1px)}
.logout-btn{padding:8px 20px;border-radius:6px;background:#64748b;color:#fff;font-weight:600}
.logout-btn:hover{background:#475569}
.route-btn,.remove-btn,.attach-btn,.ticket-btn{border-radius:8px;color:#fff;font-weight:700;transition:var(--fast)}
.route-btn{padding:10px 18px;background:var(--success);font-size:14px}
.route-btn:hover{background:#059669}
.remove-btn{padding:10px 14px;background:var(--danger);font-size:14px}
.remove-btn:hover{background:var(--primary)}
.attach-btn{padding:6px 14px;border-radius:6px;background:var(--info);font-size:12px;font-weight:600}
.attach-btn:hover{background:#2563eb}
.ticket-btn{padding:10px 24px;background:var(--warning);font-size:14px;white-space:nowrap}
.ticket-btn:hover{background:#d97706}
/* Info / badges */
.error-msg{display:none;margin-top:15px;text-align:center;color:var(--primary);font-size:14px;font-weight:600}
.info-text{display:flex;align-items:flex-start;gap:8px;margin-top:8px;padding:12px 16px;border-left:4px solid var(--info);border-radius:0 8px 8px 0;background:var(--blue-50);color:var(--blue-800);font-size:13px}
.i-icon{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--info);color:#fff;font-size:11px;font-weight:700}
.badge,.status-badge{display:inline-block;border-radius:20px;font-weight:600}
.badge{padding:4px 12px;font-size:13px}
.status-badge{padding:4px 12px;font-size:12px;font-weight:700}
.badge-blue,.status-completed{background:var(--blue-100);color:var(--blue-800)}
.badge-amber,.status-pending{background:var(--amber-100);color:var(--amber-800)}
.status-approved{background:var(--green-100);color:var(--green-800)}
.status-rejected{background:var(--red-100);color:var(--red-800)}
.approval-badge{display:inline-flex;align-items:center;gap:8px;margin-top:15px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700}
.approval-badge.manager{border:1px solid var(--warning);background:var(--amber-100);color:var(--amber-800)}
.approval-badge.supervisor{border:1px solid var(--danger);background:var(--red-100);color:var(--red-800)}
.approval-badge.weekend{border:1px solid var(--success);background:var(--green-100);color:var(--green-800)}

/* All My Requests filters/actions/edit modal */
.request-filter-bar{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:14px;align-items:end;margin:18px 0 8px;padding:18px;border:1px solid var(--border);border-radius:16px;background:#f8fafc}.request-filter-group{display:flex;flex-direction:column;gap:6px}.request-filter-group label{color:#4b5563;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.request-filter-group select{width:100%;padding:11px 12px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--dark);font-size:14px;font-weight:700}.request-filter-actions{display:flex;gap:10px}.filter-reset-btn{width:100%;padding:12px 16px;border-radius:10px;background:#64748b;color:#fff;font-size:14px;font-weight:900}.filter-reset-btn:hover{background:#475569}.filter-result-text{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:700}.no-request-row td{padding:28px!important;text-align:center;color:var(--muted);font-weight:800;background:#f8fafc!important}.request-action-stack{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.request-action-stack .attach-filename{flex-basis:100%;margin-top:0}.view-btn{background:var(--info)!important}.view-btn:hover{background:#2563eb!important}.bill-btn{background:var(--success)!important}.bill-btn:hover{background:#059669!important}.edit-btn{background:var(--warning)!important}.edit-btn:hover{background:#d97706!important}.edit-save-bar{display:flex;justify-content:flex-end;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}.edit-save-btn{padding:12px 26px;border-radius:10px;background:var(--success);color:#fff;font-size:14px;font-weight:900}.edit-save-btn:hover{background:#059669}.request-edit-input{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:10px;background:#fff;color:var(--dark);font-size:14px;font-weight:700}.request-edit-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.request-view-overlay{position:fixed;inset:0;z-index:10001;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.72);backdrop-filter:blur(5px)}.request-view-overlay.active{display:flex}.request-view-box{position:relative;width:min(1080px,96vw);max-height:90vh;overflow:auto;padding:28px;border-radius:22px;background:#fff;box-shadow:0 28px 90px rgba(0,0,0,.35);animation:popupIn .25s ease-out}.request-view-close{position:sticky;top:0;float:right;z-index:2;width:38px;height:38px;border-radius:999px;background:#f1f5f9;color:#334155;font-size:22px;font-weight:900;line-height:1}.request-view-close:hover{background:var(--red-100);color:var(--primary)}.request-view-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:2px solid var(--border)}.request-view-title{color:var(--dark);font-size:22px;font-weight:900}.request-view-subtitle{margin-top:4px;color:var(--muted);font-size:13px}.request-view-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:14px;margin-bottom:18px}.request-view-field{padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}.request-view-label{margin-bottom:5px;color:#64748b;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}.request-view-value{color:var(--dark);font-size:14px;font-weight:700;white-space:pre-line;word-break:break-word}.request-view-section{margin:18px 0;padding:18px;border:2px solid var(--border);border-radius:16px;background:#fff}.request-view-section-title{margin-bottom:14px;color:var(--primary);font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}@media(max-width:760px){.request-filter-bar{grid-template-columns:1fr}.request-view-grid{grid-template-columns:1fr}.request-view-box{padding:20px}.request-view-head{flex-direction:column}}

/* Tables */
.table-wrap{overflow-x:auto;margin-top:20px;border:2px solid var(--border);border-radius:var(--r)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table thead tr{background:#f8fafc}
.table th{padding:14px 16px;border-bottom:2px solid var(--border);text-align:left;color:#4b5563;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.table td{padding:14px 16px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
.table tbody tr{background:#fff}
.table tbody tr:hover{background:#fafafa}
.request-type-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--slate-100);color:var(--dark);font-size:12px;font-weight:900;white-space:nowrap}.request-type-pill.travel{background:var(--blue-100);color:var(--blue-800)}.request-type-pill.car{background:var(--amber-100);color:var(--amber-800)}.request-type-pill.restaurant{background:var(--green-100);color:var(--green-800)}.request-type-pill.contractor{background:var(--red-100);color:var(--red-800)}.request-type-pill.vehicle{background:#ede9fe;color:#5b21b6}.request-detail-main{color:var(--dark);font-weight:800}.request-detail-sub{margin-top:4px;color:var(--muted);font-size:12px;line-height:1.35}.request-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin:20px 0}.request-summary-card{padding:16px;border:1px solid var(--border);border-radius:var(--r);background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.03)}.request-summary-label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.request-summary-value{margin-top:4px;color:var(--primary);font-size:22px;font-weight:900}@media(max-width:900px){.request-summary-grid{grid-template-columns:repeat(2,minmax(150px,1fr))}}@media(max-width:520px){.request-summary-grid{grid-template-columns:1fr}.request-type-pill{white-space:normal}}
/* Flow steps / timeline */
.flow-container{display:flex;align-items:center;justify-content:space-between;margin-top:35px;padding:25px;border:2px dashed #cbd5e1;border-radius:var(--r);background:#f8fafc}
.flow-step{position:relative;display:flex;align-items:center;flex:1;flex-direction:column}
.flow-step:not(:last-child)::after{content:'';position:absolute;top:20px;right:-50%;z-index:0;width:100%;height:3px;background:#e2e8f0}
.flow-step.active:not(:last-child)::after{background:var(--primary)}
.step-circle{z-index:1;display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:3px solid #fff;border-radius:50%;background:#e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,.1);color:#64748b;font-size:14px;font-weight:800}
.flow-step.active .step-circle{background:var(--primary);color:#fff}
.flow-step.completed .step-circle{background:var(--success);color:#fff}
.step-label{margin-top:10px;text-align:center;color:#64748b;font-size:11px;font-weight:700;line-height:1.3}
.flow-step.active .step-label{color:var(--primary)}
.flow-step.completed .step-label{color:var(--success)}
.flow-timeline{padding:10px 0}
.tl-step{display:flex;align-items:flex-start;gap:15px;margin-bottom:5px}
.tl-step.small{margin-bottom:3px}
.tl-badge{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:36px;height:36px;margin-top:2px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;font-weight:800}
.tl-badge.gate{border:2px solid var(--warning);background:var(--amber-100);color:var(--amber-800)}
.tl-badge.fast{background:var(--green-100);color:var(--green-800);font-size:16px}
.tl-badge.slow{background:var(--red-100);color:var(--red-800);font-size:16px}
.tl-badge.normal{background:var(--amber-100);color:var(--amber-800);font-size:16px}
.tl-badge.final{background:var(--success);color:#fff;font-size:18px}
.tl-content{flex:1}.tl-title{margin-bottom:2px;color:var(--dark);font-size:14px;font-weight:700}.tl-meta{color:var(--muted);font-size:12px}
.gate-title{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--amber-100);color:var(--amber-800);font-size:13px}
.tl-line{width:2px;height:20px;margin:0 0 5px 17px;background:#e2e8f0}.tl-line.short{height:12px}
.tl-branch{margin:0 0 15px 35px;padding-left:20px;border-left:3px solid #e2e8f0}
.tl-branch-label{display:inline-block;margin-bottom:8px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.tl-branch-label.yes,.tl-outcome.yes{background:var(--green-100);color:var(--green-800)}
.tl-branch-label.no,.tl-outcome.no{background:var(--red-100);color:var(--red-800)}
.tl-branch-body{padding-bottom:5px}
.tl-outcomes{display:flex;gap:10px;margin:8px 0 10px}
.tl-outcome{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700}
.tl-stage-label{display:inline-block;margin-bottom:10px;padding:6px 16px;border-radius:20px;background:var(--sidebar);color:#fff;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.tl-stage-label.input{background:var(--info)}.tl-stage-label.output{background:var(--success)}.tl-stage-label.process{background:#64748b}

/* News to Modules Gap */
.news-section{margin-bottom:36px!important}

.header-actions{
  flex-wrap:wrap;
}

/* Sticky Top Header */
.no-sidebar .main-content{
  padding-top:0;
}
.header{
  position:sticky;
  top:0;
  z-index:999;
  margin:0 -38px 30px;
  padding:18px 38px;
  background:rgba(243,244,246,.96);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 22px rgba(15,23,42,.08);
}
.header h1{
  margin:0;
}
@media(max-width:900px){
  .header{
    margin:0 -24px 24px;
    padding:16px 24px;
  }
}
@media(max-width:560px){
  .header{
    gap:12px;
  }
}


/* Top Bar Layout */
.header{
  display:grid;
  grid-template-columns:minmax(230px,1fr) auto minmax(230px,1fr);
  align-items:center;
  gap:18px;
}
.header-left{
  justify-self:start;
}
.header h1{
  justify-self:center;
  text-align:center;
  white-space:nowrap;
}
.header-user{
  justify-self:end;
  display:flex;
  align-items:center;
  gap:12px;
  min-width:220px;
  justify-content:flex-end;
}
.header-user-photo{
  width:42px;
  height:42px;
  border-radius:999px;
  object-fit:cover;
  border:2px solid #fff;
  box-shadow:0 4px 12px rgba(15,23,42,.14);
  background:#e2e8f0;
}
.header-user-text{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  line-height:1.15;
}
.header-user-name{
  color:var(--dark);
  font-size:14px;
  font-weight:900;
  white-space:nowrap;
}
.header-user-title{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}
@media(max-width:760px){
  .header{
    grid-template-columns:1fr;
    align-items:flex-start;
  }
  .header-left,
  .header h1,
  .header-user{
    justify-self:stretch;
  }
  .header h1{
    text-align:left;
    white-space:normal;
    order:2;
  }
  .header-left{
    order:1;
  }
  .header-user{
    order:3;
    justify-content:flex-start;
    min-width:0;
  }
}

 calcLeaveDays() { const start = new Date($('leaveStartDate')?.value); const end = new Date($('leaveEndDate')?.value); const out = $('leaveCalculatedDays'); if (!out) return 0; if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) { out.textContent = '0 days'; return 0; } if (end < start) { out.textContent = 'Invalid dates'; return 0; } if ($('leaveHalfDay')?.value === 'yes') { out.textContent = '0.5 day'; return 0.5; } let days = 0; const cursor = new Date(start); while (cursor <= end) { const day = cursor.getDay(); if (day !== 0 && day !== 6) days++; cursor.setDate(cursor.getDate() + 1); } out.textContent = `${days} day${days === 1 ? '' : 's'}`; return days; }
 submitLeave(event) { event.preventDefault(); const days = this.calcLeaveDays(); const type = $('leaveType')?.value || 'N/A'; const start = $('leaveStartDate')?.value || 'N/A'; const end = $('leaveEndDate')?.value || 'N/A'; const substitute = $('leaveSubstitute')?.value || 'N/A'; this.showLoading(() => { this.showPopup('Leave Request Submitted!', `${type} request has been submitted. Period: ${start} - ${end}. Duration: ${days} day(s). Substitute: ${substitute}.`); event.target.reset(); if ($('leaveCalculatedDays')) $('leaveCalculatedDays').textContent = '0 days'; if ($('leaveAttachmentName')) $('leaveAttachmentName').textContent = ''; }); }

 todayISO() { const now = new Date(); const tzOffset = now.getTimezoneOffset() * 60000; return new Date(now - tzOffset).toISOString().slice(0, 10); }
 formatEmployeeAsOfDate() { return $('empAsOfDate')?.value || this.todayISO(); }
 isEmployeeActiveOnDate(emp, asOfDate) { if (!asOfDate) return true; const selected = new Date(`${asOfDate}T00:00:00`); const effectiveFrom = emp.effectiveFrom ? new Date(`${emp.effectiveFrom}T00:00:00`) : new Date('1900-01-01T00:00:00'); const effectiveTo = emp.effectiveTo ? new Date(`${emp.effectiveTo}T23:59:59`) : new Date('9999-12-31T23:59:59'); return selected >= effectiveFrom && selected <= effectiveTo; }

 employeeRow(emp, index) {
 const searchable = Object.values(emp).join(' ').toLowerCase();
 return `<tr data-employee-row="true" data-employee-index="${index}" data-employee-search="${searchable}" data-employee-company="${emp.company}" data-employee-department="${emp.department}" data-employee-status="${emp.status}">
 <td class="text-mono">${emp.id}</td><td class="text-strong">${emp.name}</td><td>${emp.jobTitle}</td><td>${emp.department}</td><td class="text-mono">${emp.costCenter}</td><td>${emp.company}</td><td>${emp.email}</td><td>${emp.phone}</td><td>${emp.location}</td><td>${emp.manager}</td><td><span class="status-badge ${emp.status === 'Active' ? 'status-approved' : 'status-rejected'}">${emp.status}</span></td>
 </tr>`;
 }
 getFilteredEmployees() {
 const q = ($('empSearch')?.value || '').trim().toLowerCase();
 const company = $('empCompany')?.value || 'all';
 const department = $('empDepartment')?.value || 'all';
 const status = $('empStatus')?.value || 'all';
 const asOfDate = this.formatEmployeeAsOfDate();
 return EMPLOYEES.filter(emp => {
 const searchable = Object.entries(emp).filter(([key]) => !['effectiveFrom','effectiveTo'].includes(key)).map(([,value]) => value).join(' ').toLowerCase();
 return (!q || searchable.includes(q)) && (company === 'all' || emp.company === company) && (department === 'all' || emp.department === department) && (status === 'all' || emp.status === status) && this.isEmployeeActiveOnDate(emp, asOfDate);
 });
 }
 applyEmployeeFilters() {
 const filtered = this.getFilteredEmployees();
 const allowed = new Set(filtered.map(emp => emp.id));
 document.querySelectorAll('#page-employees tbody tr[data-employee-row="true"]').forEach(row => {
 row.classList.toggle('hidden', !allowed.has(row.children[0]?.textContent));
 });
 const tbody = document.querySelector('#page-employees tbody');
 let noRow = $('noFilteredEmployeesRow');
 if (!noRow && tbody) {
 noRow = document.createElement('tr');
 noRow.id = 'noFilteredEmployeesRow';
 noRow.className = 'no-request-row hidden';
 noRow.innerHTML = '<td colspan="11">No employees found for selected filters.</td>';
 tbody.appendChild(noRow);
 }
 noRow?.classList.toggle('hidden', filtered.length !== 0);
 if ($('employeeFilterResult')) $('employeeFilterResult').textContent = `Showing ${filtered.length} of ${EMPLOYEES.length} employees as of ${this.formatEmployeeAsOfDate()}.`;
 }
 resetEmployeeFilters() {
 if ($('empSearch')) $('empSearch').value = '';
 if ($('empCompany')) $('empCompany').value = 'all';
 if ($('empDepartment')) $('empDepartment').value = 'all';
 if ($('empStatus')) $('empStatus').value = 'all';
 this.applyEmployeeFilters();
 }
 exportEmployees() {
 const headers = ['Employee ID','Name Surname','Job Title','Department','Cost Center','Company','Email','Phone','Location','Manager','Status'];
 const keys = ['id','name','jobTitle','department','costCenter','company','email','phone','location','manager','status'];
 const rows = this.getFilteredEmployees();
 const escapeCsv = value => `"${String(value ?? '').replace(/"/g, '""')}"`;
 const csv = '\ufeff' + [headers.join(';'), ...rows.map(emp => keys.map(key => escapeCsv(emp[key])).join(';'))].join('\n');
 const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = `employee_personnel_list_${this.formatEmployeeAsOfDate()}.csv`;
 document.body.appendChild(a);
 a.click();
 a.remove();
 URL.revokeObjectURL(url);
 this.showPopup('Employee List Exported!', `${rows.length} employee record(s) exported as CSV. You can open the file directly in Excel.`);
 }

    getFlightSummary(){if(this.radioValue('usePlane')!=='yes')return 'No';const l=this.radioValue('travelType')==='local';return $$('.flight-row').map((r,i)=>{const dt=r.querySelector('.flight-date-time')?.value||'N/A',no=r.querySelector('.flight-no')?.value||'N/A',fr=l?r.querySelector('.flight-from-local')?.value:r.querySelector('.flight-from-foreign')?.value?.trim(),to=l?r.querySelector('.flight-to-local')?.value:r.querySelector('.flight-to-foreign')?.value?.trim();return `Flight ${i+1}: ${dt} / ${fr||'N/A'} → ${to||'N/A'} / Flight No: ${no}`;}).join(' | ');}

    checkApproval() {
      const departure = new Date($('carDepart').value);
      const box = $('approvalBadgeBox');
      if (Number.isNaN(departure.getTime())) { box.innerHTML = ''; return; }
      const minutes = departure.getHours() * 60 + departure.getMinutes();
      const isWeekend = [0, 6].includes(departure.getDay());
      let cls = 'manager';
      let text = '📌 Weekday 08:00-17:40 — Manager Approval';
      if (isWeekend) { cls = 'weekend'; text = '📅 Weekend — Standard Approval'; }
      else if (minutes > CONFIG.workday.end) { cls = 'supervisor'; text = '🚨 Weekday After 17:40 — Shift Supervisor Approval Required'; }
      else if (minutes < CONFIG.workday.start) { cls = 'supervisor'; text = '🚨 Before 08:00 — Shift Supervisor Approval Required'; }
      box.innerHTML = `<div class="approval-badge ${cls}">${text}</div>`;
